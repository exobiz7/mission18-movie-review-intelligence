name: Mission18 G1 Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (pinned action and uv version)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync isolated dependencies
        run: uv sync --locked --group dev

      - name: Check contract manifest
        run: uv run --locked --group dev python scripts/check_contracts.py

      - name: Validate Python syntax
        run: uv run --locked --group dev python -m compileall -q scripts tests

      - name: Ruff lint
        run: uv run --locked --group dev ruff check scripts tests

      - name: Ruff format
        run: uv run --locked --group dev ruff format --check scripts tests

      - name: Contract unit tests
        run: uv run --locked --group dev pytest -q tests/test_contract_spec.py
