[project]
name = "mission18-movie-review-intelligence"
version = "0.1.0"
description = "Streamlit + FastAPI movie review sentiment intelligence coursework and reusable service baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.7,<3",
    "streamlit>=1.40,<2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ml = [
    "huggingface-hub>=0.26,<2",
    "safetensors>=0.4,<1",
    "torch>=2.5,<3",
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live_model: requires pinned, real inference weights; excluded from G1",
    "live_http: starts real API or UI services; excluded from G1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".local", "release", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend", "frontend"]
omit = ["*/tests/*"]
